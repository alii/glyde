name: test

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.19.1"
          rebar3-version: "3"
      - run: gleam deps download
      - run: gleam test

  # The examples are the only consumers of glyde's public API from outside the
  # package, so compiling them catches a breaking change the library's own
  # tests cannot see.
  example:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: [ping_pong, slash_command]
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.19.1"
          rebar3-version: "3"
      - run: gleam deps download
      - run: gleam build

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.19.1"
          rebar3-version: "3"
      - run: gleam format --check src test
